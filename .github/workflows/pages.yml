name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and don't cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The gate. Shipping a shop that can't add to a cart is worse than not
      # shipping.
      - name: Tests
        run: |
          npm test
          npm run lint:contrast

      # VITE_API_URL comes from .env.production, so the origin is in the repo
      # rather than in this file — one place to change it.
      - name: Build
        run: npm run build

      # Pages has no SPA fallback: it serves a file or it 404s. Handing the app
      # shell back as the 404 body is what lets /admin/orders/5 survive a hard
      # refresh — React Router reads the URL and renders the right screen.
      - name: Fall back to the app shell
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
