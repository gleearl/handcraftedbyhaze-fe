[build]
  command = "npm run build"
  publish = "dist"

# Product photos, the GCash QR, the favicon, and the font are served from
# public/ rather than bundled, so their URLs stay stable — the Google Sheet's
# `image` column and index.html's font preload both hardcode these paths.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build output is immutable; the browser never needs to revalidate it.
[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
